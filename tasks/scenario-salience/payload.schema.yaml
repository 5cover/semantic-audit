# yaml-language-server: $schema=https://json-schema.org/draft/2020-12/schema
$title: Scenario semantic-salience payload contract
description: Task-specific contract for payload objects used by the generic audit workflow. This schema does not validate the review document. It defines only the payloads used by this audit task.
type: object
required:
  - task
  - summary
  - finding
properties:
  task:
    type: object
    required:
      - author_annotation_format
      - generator_facing_content
      - protected_content
    properties:
      author_annotation_format:
        type: string
        const: markdown_blockquote
      generator_facing_content:
        type: string
      protected_content:
        type: array
        uniqueItems: true
        items:
          type: string
      diagnostic_terms:
        type: array
        uniqueItems: true
        items:
          type: string
  summary:
    type: object
    required:
      - by_kind
      - by_owner
    properties:
      by_kind:
        type: object
        additionalProperties:
          type: integer
          minimum: 0
      by_owner:
        type: object
        propertyNames:
          enum:
            - story
            - author
            - none
            - mixed
            - unclear
        additionalProperties:
          type: integer
          minimum: 0
  finding:
    type: object
    required:
      - kinds
      - owner
    properties:
      kinds:
        type: array
        minItems: 1
        uniqueItems: true
        items:
          type: string
          enum:
            - counterfactual_salience
            - defensive_specification
            - resolved_modal
            - writer_imperative
            - authorial_rationale
            - interpretive_scaffolding
            - scope_perimeter
            - rederivation
            - duplicate_realization_instruction
            - empty_precision
            - thesis_restatement
            - strategic_alternative
            - epistemic_boundary
            - legal_boundary
            - technical_boundary
            - other
      owner:
        type: string
        enum:
          - story
          - author
          - none
          - mixed
          - unclear
      information_effect:
        type: object
        required:
          - preserves
          - removes_from_llm_context
          - moves_to_author_annotation
        properties:
          preserves:
            type: array
            items:
              type: string
          removes_from_llm_context:
            type: array
            items:
              type: string
          moves_to_author_annotation:
            type: array
            items:
              type: string
      annotation:
        type: string
